<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" /> <!-- Indigo -->
      <stop offset="100%" stop-color="#3b82f6" /> <!-- Blue -->
    </linearGradient>
    <linearGradient id="sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" /> <!-- Light Blue -->
      <stop offset="100%" stop-color="#00f5ff" /> <!-- Cyan -->
    </linearGradient>
  </defs>

  <!-- Base Circle -->
  <rect width="512" height="512" rx="128" fill="url(#primary-grad)" />

  <!-- Styled 'H' with a central sparkle representing human editing -->
  <!-- Left Pillar -->
  <rect x="140" y="120" width="50" height="272" rx="25" fill="#ffffff" />
  <!-- Right Pillar -->
  <rect x="322" y="120" width="50" height="272" rx="25" fill="#ffffff" />
  <!-- Crossbar -->
  <rect x="180" y="231" width="150" height="50" rx="10" fill="#ffffff" />

  <!-- Magic Sparkle floating over the crossbar (representing AI/Human transformation) -->
  <path d="M256 160 Q256 220 316 220 Q256 220 256 280 Q256 220 196 220 Q256 220 256 160 Z" fill="url(#sparkle-grad)" />
</svg>